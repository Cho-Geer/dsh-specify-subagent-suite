# CI: typecheck + build + test on every push/PR.
# Publish deliberately lives in release.yml (main-push only, version-change
# gated) so PRs and branch pushes never touch the registry.
name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build client bundle
        run: pnpm run build

      - name: Test
        run: pnpm test
